spring.application.name=tahsilat

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.flyway.enabled=true

server.port=${PORT:8080}

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

app.collection-import.startup-enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

//logging.level.org.springframework.security=DEBUG
//logging.level.org.hibernate.SQL=DEBUG
//logging.level.org.hibernate.orm.jdbc.bind=TRACE

server.error.include-message=never
server.error.include-binding-errors=never

logging.level.org.hibernate.orm.jdbc.bind=OFF

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.veli.tahsilat.security=WARN
logging.level.com.veli.tahsilat.auth.service.impl.AuthServiceImpl=INFO

app.swagger.public=${APP_SWAGGER_PUBLIC:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}